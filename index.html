<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Note Generator</title>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js" onerror="window.__docxLoadFailed=true;" onload="window.__docxLoaded=true;"></script>
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1f2320; --sub:#5a6058; --line:#e3e0d8;
  --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#e8f2ec; --danger:#b3452f;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171a17; --card:#20241f; --ink:#eef0ea; --sub:#a2a89c; --line:#333a31;
    --accent:#6bbf94; --accent-ink:#0c1310; --accent-soft:#213229;
  }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px;}
h1{font-size:1.5rem;margin:0 0 4px;}
.lede{color:var(--sub);margin:0 0 22px;font-size:.95rem;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.card h2{font-size:1rem;margin:0 0 12px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
label{display:block;font-size:.78rem;color:var(--sub);margin-bottom:4px;}
input,textarea,select{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  font:inherit;background:transparent;color:var(--ink);
}
textarea{resize:vertical;min-height:70px;font-size:.88rem;line-height:1.4;}
.field{margin-bottom:10px;}
.subject{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.subject-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.subject-head b{font-size:.95rem;}
.remove-btn{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.8rem;padding:4px 6px;}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:10px 16px;font-size:.9rem;font-weight:600;cursor:pointer;}
.btn.secondary{background:var(--accent-soft);color:var(--accent);}
.btn:disabled{opacity:.5;cursor:default;}
.top-actions{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.note h3{margin:0 0 2px;font-size:1.05rem;}
.note .topic{color:var(--accent);font-weight:600;margin-bottom:10px;}
.meta{font-size:.85rem;color:var(--sub);margin-bottom:12px;line-height:1.6;}
.meta b{color:var(--ink);}
.note h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.03em;color:var(--sub);margin:16px 0 8px;}
.note ul{margin:0 0 4px;padding-left:20px;}
.note li{margin-bottom:4px;line-height:1.5;font-size:.92rem;}
.step-title{font-weight:600;font-size:.92rem;margin-bottom:4px;}
[contenteditable="true"]{outline:none;}
[contenteditable="true"]:focus{background:var(--accent-soft);border-radius:4px;}
.status{font-size:.82rem;color:var(--sub);margin-top:8px;}
.error{color:var(--danger);font-size:.82rem;margin-top:8px;}
.hint{font-size:.78rem;color:var(--sub);margin-top:4px;}
.check-row{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--sub);margin-top:6px;}
.check-row input{width:auto;}
@media print{ .no-print{display:none!important;} body{background:#fff;color:#000;} .note{border:none;page-break-after:always;} }
@media (max-width:600px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Lesson Note Generator</h1>
  <p class="lede">This runs entirely in your browser using your own Google Gemini API key.</p>
  <p class="lede">This app is built by Olajcodes.</p>

  <div class="card no-print">
    <h2>AI provider</h2>
    <div class="grid">
      <div class="field">
        <label>Provider</label>
        <select id="f-provider" onchange="onProviderChange()">
          <!-- <option value="openai">OpenAI (ChatGPT)</option> -->
          <option value="gemini">Google Gemini</option>
        </select>
      </div>
      <div class="field">
        <label>Model</label>
        <input id="f-model" list="model-suggestions">
        <datalist id="model-suggestions"></datalist>
      </div>
    </div>
    <div class="field">
      <label id="f-apikey-label">API key</label>
      <input id="f-apikey" type="password" placeholder="sk-...">
      <p class="hint" id="f-apikey-hint">Get one at platform.openai.com/api-keys. Stored only in this browser, never uploaded anywhere.</p>
      <label class="check-row"><input type="checkbox" id="f-remember"> Remember on this device (localStorage)</label>
    </div>
  </div>

  <div class="card no-print">
    <h2>Week details</h2>
    <div class="grid">
      <div class="field"><label>School</label><input id="f-school" placeholder="DE HIGH-RANK MONTESSORI SCHOOLS"></div>
      <div class="field"><label>Teacher's name</label><input id="f-teacher" placeholder="Type the Teacher's name here."></div>
      <div class="field"><label>Class</label><input id="f-class" placeholder="Grade 2"></div>
      <div class="field"><label>Term</label><input id="f-term" placeholder="First Term"></div>
      <div class="field"><label>Academic session</label><input id="f-session" placeholder="2026/2027"></div>
      <div class="field"><label>Week</label><input id="f-week" placeholder="2"></div>
    </div>
  </div>

  <div class="card no-print">
    <h2>Subjects for this week</h2>
    <div id="subjects"></div>
    <button class="btn secondary" onclick="addSubject()">+ Add subject</button>
  </div>

  <div class="top-actions no-print">
    <button class="btn" id="gen-btn" onclick="generateAll()">Generate lesson notes</button>
    <!-- <button class="btn secondary" id="dl-btn" onclick="downloadAll()" disabled>Download as Markdown</button> -->
    <button class="btn secondary" id="docx-btn" onclick="downloadWord()" disabled>Download as Word (.docx)</button>
    <button class="btn secondary" id="print-btn" onclick="window.print()" disabled>Print / Save as PDF</button>
  </div>
  <div id="global-status" class="status no-print"></div>

  <div id="output"></div>
</div>

<script>
let subjects = [];
let sid = 0;

const PROVIDER_INFO = {
  openai: {
    label: 'OpenAI API key',
    hint: 'Get one at platform.openai.com/api-keys. Stored only in this browser, never uploaded anywhere.',
    keyPrefix: 'sk-...',
    storageKey: 'lng_openai_key',
    models: ['gpt-4o-mini', 'gpt-4o', 'gpt-5-mini', 'gpt-5', 'gpt-5.5'],
    defaultModel: 'gpt-4o-mini'
  },
  gemini: {
    label: 'Google AI Studio API key',
    hint: 'Get one free at aistudio.google.com/apikey. Stored only in this browser, never uploaded anywhere.',
    keyPrefix: 'AIza...',
    storageKey: 'lng_gemini_key',
    models: ['gemini-3.1-flash-lite', 'gemini-2.5-flash', 'gemini-3.5-flash', 'gemini-2.5-pro'],
    defaultModel: 'gemini-3.1-flash-lite'
  }
};

function onProviderChange(){
  const provider = document.getElementById('f-provider').value;
  const info = PROVIDER_INFO[provider];
  document.getElementById('f-apikey-label').textContent = info.label;
  document.getElementById('f-apikey-hint').textContent = info.hint;
  document.getElementById('f-apikey').placeholder = info.keyPrefix;
  document.getElementById('f-model').value = info.defaultModel;
  const dl = document.getElementById('model-suggestions');
  dl.innerHTML = info.models.map(m => `<option value="${m}">`).join('');
  const remembered = localStorage.getItem(info.storageKey);
  document.getElementById('f-apikey').value = remembered || '';
  document.getElementById('f-remember').checked = !!remembered;
}
document.getElementById('f-remember').addEventListener('change', e=>{
  const provider = document.getElementById('f-provider').value;
  if(!e.target.checked) localStorage.removeItem(PROVIDER_INFO[provider].storageKey);
});
onProviderChange();

function addSubject(){
  const id = 'sub' + (sid++);
  subjects.push({id, name:'', topic:'', duration:'40 minutes per period', materials:'', scheme:''});
  renderSubjects();
}
function removeSubject(id){ subjects = subjects.filter(s=>s.id!==id); renderSubjects(); }
function updateField(id, key, val){ const s = subjects.find(s=>s.id===id); if(s) s[key] = val; }

function renderSubjects(){
  const el = document.getElementById('subjects');
  el.innerHTML = subjects.map(s => `
    <div class="subject">
      <div class="subject-head">
        <b>${escHtml(s.name) || 'New subject'}</b>
        <button class="remove-btn" onclick="removeSubject('${s.id}')">Remove</button>
      </div>
      <div class="grid">
        <div class="field"><label>Subject</label><input data-live="${s.id}" data-key="name" value="${escAttr(s.name)}"></div>
        <div class="field"><label>Duration</label><input data-live="${s.id}" data-key="duration" value="${escAttr(s.duration)}"></div>
      </div>
      <div class="field"><label>Topic (leave blank to let it infer one from the subtopics)</label><input data-live="${s.id}" data-key="topic" value="${escAttr(s.topic)}"></div>
      <div class="field"><label>Instructional materials (optional — leave blank to let it suggest some)</label><input data-live="${s.id}" data-key="materials" value="${escAttr(s.materials)}"></div>
      <div class="field"><label>Scheme of work — paste this week's subtopics/breakdown</label><textarea data-live="${s.id}" data-key="scheme" placeholder="e.g.&#10;• Comparing numbers using <, >, = symbols&#10;• Arranging numbers in ascending/descending order&#10;• Identifying number patterns">${escHtml(s.scheme)}</textarea></div>
    </div>
  `).join('') || '<p style="color:var(--sub);font-size:.9rem;">No subjects yet — add one to get started.</p>';
  el.querySelectorAll('[data-live]').forEach(inp=>{
    inp.oninput = function(){ updateField(this.dataset.live, this.dataset.key, this.value); if(this.dataset.key==='name'){ this.closest('.subject').querySelector('.subject-head b').textContent = this.value || 'New subject'; } };
  });
}
function escHtml(str){ return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(str){ return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

function collectHeader(){
  return {
    school: document.getElementById('f-school').value || 'School',
    teacher: document.getElementById('f-teacher').value || 'Teacher',
    klass: document.getElementById('f-class').value || 'Class',
    term: document.getElementById('f-term').value || '',
    session: document.getElementById('f-session').value || '',
    week: document.getElementById('f-week').value || ''
  };
}

async function callOpenAI(apiKey, model, prompt){
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
    body: JSON.stringify({
      model,
      messages: [{role:'user', content: prompt}],
      response_format: {type:'json_object'},
      temperature: 0.6
    })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error(`OpenAI API error (${res.status}): ${errText.slice(0,200)}`);
  }
  const data = await res.json();
  const text = data.choices?.[0]?.message?.content;
  if(!text) throw new Error('No content returned from the model.');
  return JSON.parse(text);
}

async function callGemini(apiKey, model, prompt){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { responseMimeType: 'application/json', temperature: 0.6 }
    })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error(`Gemini API error (${res.status}): ${errText.slice(0,200)}`);
  }
  const data = await res.json();
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!text) throw new Error('No content returned from the model.');
  return JSON.parse(text);
}

async function callProvider(provider, apiKey, model, prompt){
  return provider === 'gemini' ? callGemini(apiKey, model, prompt) : callOpenAI(apiKey, model, prompt);
}

async function generateAll(){
  const provider = document.getElementById('f-provider').value;
  const apiKey = document.getElementById('f-apikey').value.trim();
  const statusEl = document.getElementById('global-status');
  if(!apiKey){ statusEl.textContent = 'Enter your API key first.'; return; }
  if(document.getElementById('f-remember').checked){ localStorage.setItem(PROVIDER_INFO[provider].storageKey, apiKey); }
  const model = document.getElementById('f-model').value.trim() || PROVIDER_INFO[provider].defaultModel;

  const validSubjects = subjects.filter(s => s.name.trim() && s.scheme.trim());
  if(!validSubjects.length){ statusEl.textContent = 'Add at least one subject with a name and pasted scheme-of-work subtopics.'; return; }

  const genBtn = document.getElementById('gen-btn');
  genBtn.disabled = true;
  const header = collectHeader();
  const output = document.getElementById('output');
  output.innerHTML = '';

  for(let i=0;i<validSubjects.length;i++){
    const s = validSubjects[i];
    statusEl.textContent = `Generating ${i+1} of ${validSubjects.length}: ${s.name}...`;
    try{
      const data = await generateOne(provider, apiKey, model, header, s);
      renderNote(header, s, data);
    }catch(e){
      const div = document.createElement('div');
      div.className = 'note';
      div.innerHTML = `<p class="error">Could not generate ${escHtml(s.name)}: ${escHtml(e.message||String(e))}</p>`;
      output.appendChild(div);
    }
  }
  statusEl.textContent = `Done. Generated ${validSubjects.length} lesson note(s).`;
  genBtn.disabled = false;
  document.getElementById('dl-btn').disabled = false;
  document.getElementById('docx-btn').disabled = false;
  document.getElementById('print-btn').disabled = false;
}

async function generateOne(provider, apiKey, model, header, s){
  const durationMinutes = (s.duration.match(/\d+/) || [40])[0];
  const prompt = `You write primary-school lesson notes for a Nigerian school, in a fixed instructional format.

Class: ${header.klass}
Subject: ${s.name}
${s.topic ? `Topic: ${s.topic}` : 'Topic: infer a clear, specific topic title from the subtopics below.'}
Duration: ${s.duration}
${s.materials ? `Instructional materials: ${s.materials}` : 'Instructional materials: suggest 3-6 simple, realistic classroom materials for this topic.'}

This week's scheme of work (subtopics to cover):
${s.scheme}

Respond with JSON only, matching exactly this shape:
{
  "topic": "string",
  "materials": ["string", ...],
  "objectives": ["string", ...] (3-5 behavioral objectives, each starting with an action verb, age-appropriate for ${header.klass}),
  "procedure": [
    {"title": "Introduction", "minutes": number, "items": ["string", ...]},
    {"title": "Explicit Instruction / Modeling", "minutes": number, "items": ["string", ...]},
    {"title": "Guided Practice", "minutes": number, "items": ["string", ...]},
    {"title": "Independent Practice / Class Activity", "minutes": number, "items": ["string", ...]},
    {"title": "Evaluation & Conclusion", "minutes": number, "items": ["string", ...]}
  ]
}
The five "minutes" values must sum to ${durationMinutes}. Cover every subtopic listed above somewhere in the procedure. Keep items concrete and classroom-practical, matching how an experienced Nigerian primary-school teacher would phrase a lesson plan. Base "Independent Practice" and "Evaluation" on real questions/exercises drawn from the subtopics, not generic filler.`;

  return await callProvider(provider, apiKey, model, prompt);
}

function renderNote(header, s, data){
  const output = document.getElementById('output');
  const div = document.createElement('div');
  div.className = 'note';
  const materialsList = (data.materials||[]).join(', ');
  div.innerHTML = `
    <h3 contenteditable="true">${escHtml(s.name.toUpperCase())}</h3>
    <div class="topic" contenteditable="true">${escHtml(data.topic || s.topic)}</div>
    <div class="meta">
      <div><b>School:</b> ${escHtml(header.school)}</div>
      <div><b>Teacher:</b> ${escHtml(header.teacher)}</div>
      <div><b>Class:</b> ${escHtml(header.klass)} &nbsp; <b>Term:</b> ${escHtml(header.term)} &nbsp; <b>Session:</b> ${escHtml(header.session)} &nbsp; <b>Week:</b> ${escHtml(header.week)}</div>
      <div><b>Duration:</b> ${escHtml(s.duration)}</div>
      <div contenteditable="true"><b>Instructional Materials:</b> ${escHtml(materialsList)}</div>
    </div>
    <h4>Behavioral Objectives</h4>
    <p style="font-size:.9rem;color:var(--sub);margin:0 0 6px;">By the end of the lesson, pupils should be able to:</p>
    <ul contenteditable="true">${(data.objectives||[]).map(o=>`<li>${escHtml(o)}</li>`).join('')}</ul>
    <h4>Instructional Procedure</h4>
    ${(data.procedure||[]).map((step,idx)=>`
      <div class="step">
        <div class="step-title">Step ${idx+1}: ${escHtml(step.title)} (${escHtml(String(step.minutes))} minutes)</div>
        <ul contenteditable="true">${(step.items||[]).map(it=>`<li>${escHtml(it)}</li>`).join('')}</ul>
      </div>
    `).join('')}
  `;
  output.appendChild(div);
  div._data = {header, subject: s, note: data};
}

function downloadAll(){
  const notes = Array.from(document.querySelectorAll('#output .note'));
  if(!notes.length) return;
  let md = '';
  notes.forEach((div, idx) => {
    const d = div._data;
    if(!d) return;
    md += `# ${idx+1}. ${d.subject.name.toUpperCase()}\n\n`;
    md += `- **School:** ${d.header.school}\n`;
    md += `- **Teacher:** ${d.header.teacher}\n`;
    md += `- **Class:** ${d.header.klass}\n`;
    md += `- **Term:** ${d.header.term}\n`;
    md += `- **Academic Session:** ${d.header.session}\n`;
    md += `- **Week:** ${d.header.week}\n`;
    md += `- **Topic:** ${d.note.topic || d.subject.topic}\n`;
    md += `- **Duration:** ${d.subject.duration}\n`;
    md += `- **Instructional Materials:** ${(d.note.materials||[]).join(', ')}\n\n`;
    md += `**Behavioral Objectives**\n\nBy the end of the lesson, pupils should be able to:\n\n`;
    (d.note.objectives||[]).forEach(o => md += `- ${o}\n`);
    md += `\n**Instructional Procedure**\n\n`;
    (d.note.procedure||[]).forEach((step,i) => {
      md += `*Step ${i+1}: ${step.title} (${step.minutes} minutes)*\n\n`;
      (step.items||[]).forEach(it => md += `- ${it}\n`);
      md += `\n`;
    });
    md += `\n---\n\n`;
  });
  const header = collectHeader();
  const blob = new Blob([md], {type:'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `lesson-notes-week-${header.week||''}.md`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function loadDocxLib(){
  // Give the CDN script a moment if it's still in flight, and retry once if it never attached.
  return new Promise((resolve, reject) => {
    if(window.docx) return resolve(window.docx);
    if(window.__docxLoadFailed) return reject(new Error('script failed to load (network/ad-blocker?)'));
    let waited = 0;
    const iv = setInterval(() => {
      waited += 100;
      if(window.docx){ clearInterval(iv); resolve(window.docx); }
      else if(window.__docxLoadFailed || waited > 4000){
        clearInterval(iv);
        reject(new Error('script did not finish loading in time'));
      }
    }, 100);
  });
}

async function downloadWord(){
  const statusEl = document.getElementById('global-status');
  const notes = Array.from(document.querySelectorAll('#output .note'));
  if(!notes.length){
    statusEl.textContent = 'Generate at least one lesson note first, then Download as Word.';
    return;
  }

  let docxLib;
  statusEl.textContent = 'Preparing Word file...';
  try{
    docxLib = await loadDocxLib();
  }catch(e){
    statusEl.innerHTML = 'Could not load the Word export library (' + escHtml(e.message) +
      '). Check your internet connection, then <a href="#" onclick="location.reload();return false;">reload this page</a> and try again.';
    return;
  }

  const { Document, Packer, Paragraph, TextRun, HeadingLevel, PageBreak } = docxLib;
  const allData = notes.map(div => div._data).filter(Boolean);
  const children = [];

  allData.forEach((d, idx) => {
    if(idx > 0){ children.push(new Paragraph({children:[new PageBreak()]})); }
    children.push(new Paragraph({text: `${idx+1}. ${d.subject.name.toUpperCase()}`, heading: HeadingLevel.HEADING_1}));
    children.push(new Paragraph({text: d.note.topic || d.subject.topic, heading: HeadingLevel.HEADING_2}));
    [
      `School: ${d.header.school}`,
      `Teacher: ${d.header.teacher}`,
      `Class: ${d.header.klass}    Term: ${d.header.term}    Academic Session: ${d.header.session}    Week: ${d.header.week}`,
      `Duration: ${d.subject.duration}`,
      `Instructional Materials: ${(d.note.materials||[]).join(', ')}`
    ].forEach(line => children.push(new Paragraph({text: line})));

    children.push(new Paragraph({text: 'Behavioral Objectives', heading: HeadingLevel.HEADING_2}));
    children.push(new Paragraph({children:[new TextRun({text:'By the end of the lesson, pupils should be able to:', italics:true})]}));
    (d.note.objectives||[]).forEach(o => children.push(new Paragraph({text:o, bullet:{level:0}})));

    children.push(new Paragraph({text: 'Instructional Procedure', heading: HeadingLevel.HEADING_2}));
    (d.note.procedure||[]).forEach((step,i) => {
      children.push(new Paragraph({text:`Step ${i+1}: ${step.title} (${step.minutes} minutes)`, heading: HeadingLevel.HEADING_3}));
      (step.items||[]).forEach(it => children.push(new Paragraph({text:it, bullet:{level:0}})));
    });
  });

  try{
    const doc = new Document({ sections: [{ children }] });
    const blob = await Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `lesson-notes-week-${collectHeader().week||''}.docx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    statusEl.textContent = 'Word file downloaded.';
  }catch(e){
    statusEl.textContent = 'Could not build the Word file: ' + (e.message || String(e));
  }
}

addSubject();
</script>
</body>
</html>
